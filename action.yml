name: deadcode-gate
description: Dead code quantifier: measure how much of a repository is dead, instead of guessing. Zero-dependency CLI.
branding:
  icon: shield
  color: blue
inputs:
  args:
    description: Arguments passed to gate.py
    required: false
    default: "--help"
runs:
  using: composite
  steps:
    - shell: bash
      run: python "${{ github.action_path }}/gate.py" ${{ inputs.args }}
